name: Release packages

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry, such as v0.3.7
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release_please:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Prepare release pull request or release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Find pending release pull request
        id: pending_release
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_branch=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --label "autorelease: pending" \
            --json headRefName \
            --jq '.[0].headRefName // empty')
          echo "head_ref=$release_branch" >> "$GITHUB_OUTPUT"
          if [ -n "$release_branch" ]; then
            echo "Pending release pull request found on $release_branch."
          else
            echo "No pending release pull request found."
          fi

      - name: Check out the release pull request
        if: steps.pending_release.outputs.head_ref != ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js for release synchronization
        if: steps.pending_release.outputs.head_ref != ''
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies for release synchronization
        if: steps.pending_release.outputs.head_ref != ''
        run: npm ci

      - name: Sync workspace dependency ranges
        if: steps.pending_release.outputs.head_ref != ''
        env:
          RELEASE_BRANCH: ${{ steps.pending_release.outputs.head_ref }}
        run: |
          git fetch origin "$RELEASE_BRANCH"
          git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
          npm run release:sync
          if git diff --quiet; then
            echo "Release workspace dependency ranges are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages package-lock.json registry.json
          git commit -m "chore: sync release workspace dependency ranges"
          git push origin "HEAD:$RELEASE_BRANCH"

      - name: Dispatch publish on the release tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        # release_please has no checkout, so gh cannot infer the repository from cwd.
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f tag="$RELEASE_TAG"

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/tags/v') &&
      inputs.tag == github.ref_name
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up current npm 11
        run: npm install --global npm@11

      - name: Verify release metadata before installing dependencies
        run: node scripts/release/verify-release-version.mjs "$RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Check package publication status
        id: package-status
        run: |
          version="${RELEASE_TAG#v}"
          if npm view "@chardesk/protocol@$version" version >/dev/null 2>&1; then
            echo "protocol_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "protocol_published=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "@chardesk/cell-core@$version" version >/dev/null 2>&1; then
            echo "cell_core_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "cell_core_published=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "@chardesk/rendering@$version" version >/dev/null 2>&1; then
            echo "rendering_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "rendering_published=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "@chardesk/fonts@$version" version >/dev/null 2>&1; then
            echo "fonts_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "fonts_published=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "@chardesk/font-maple@$version" version >/dev/null 2>&1; then
            echo "font_maple_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "font_maple_published=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "@chardesk/cli@$version" version >/dev/null 2>&1; then
            echo "cli_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "cli_published=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "@chardesk/mcp@$version" version >/dev/null 2>&1; then
            echo "mcp_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp_published=false" >> "$GITHUB_OUTPUT"
          fi

      # Release tags are created only after the main commit passes Verify.
      # Publish validates and smoke-tests the packed artifacts below; rerunning
      # the full repository suite here would duplicate the main verification.
      - name: Pack release assets
        run: |
          mkdir release-assets
          npm pack --workspace @chardesk/protocol --pack-destination release-assets
          npm pack --workspace @chardesk/cell-core --pack-destination release-assets
          npm pack --workspace @chardesk/rendering --pack-destination release-assets
          npm pack --workspace @chardesk/fonts --pack-destination release-assets
          npm pack --workspace @chardesk/font-maple --pack-destination release-assets
          npm pack --workspace @chardesk/cli --pack-destination release-assets
          npm pack --workspace @chardesk/mcp --pack-destination release-assets

      - name: Smoke test packed packages
        run: >-
          node scripts/release/smoke-packed-packages.mjs
          release-assets/chardesk-protocol-${RELEASE_TAG#v}.tgz
          release-assets/chardesk-cell-core-${RELEASE_TAG#v}.tgz
          release-assets/chardesk-rendering-${RELEASE_TAG#v}.tgz
          release-assets/chardesk-fonts-${RELEASE_TAG#v}.tgz
          release-assets/chardesk-font-maple-${RELEASE_TAG#v}.tgz
          release-assets/chardesk-cli-${RELEASE_TAG#v}.tgz
          release-assets/chardesk-mcp-${RELEASE_TAG#v}.tgz

      - name: Publish protocol to npm
        if: steps.package-status.outputs.protocol_published != 'true'
        run: npm publish --workspace @chardesk/protocol --access public --provenance

      - name: Publish Cell Core to npm
        if: steps.package-status.outputs.cell_core_published != 'true'
        run: npm publish --workspace @chardesk/cell-core --access public --provenance

      - name: Publish fonts to npm
        if: steps.package-status.outputs.fonts_published != 'true'
        run: npm publish --workspace @chardesk/fonts --access public --provenance

      - name: Publish Maple font pack to npm
        if: steps.package-status.outputs.font_maple_published != 'true'
        run: npm publish --workspace @chardesk/font-maple --access public --provenance

      - name: Publish rendering to npm
        if: steps.package-status.outputs.rendering_published != 'true'
        run: npm publish --workspace @chardesk/rendering --access public --provenance

      - name: Publish CLI to npm
        if: steps.package-status.outputs.cli_published != 'true'
        run: npm publish --workspace @chardesk/cli --access public --provenance

      - name: Publish MCP server to npm
        if: steps.package-status.outputs.mcp_published != 'true'
        run: npm publish --workspace @chardesk/mcp --access public --provenance

      - name: Upload package artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.tgz --clobber
