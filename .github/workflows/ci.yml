name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERIFY_SCRIPT: ${{ github.event_name == 'pull_request' && 'check:pr' || 'check:full' }}
  VERIFY_BASE: ${{ github.event.pull_request.base.sha || '' }}

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release metadata before installing dependencies
        run: |
          npm run release:verify
          node --test scripts/release/*.test.mjs

  plan:
    name: Verification plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.plan.outputs.quality }}
      workspace-tests: ${{ steps.plan.outputs.workspace-tests }}
      node-tests: ${{ steps.plan.outputs.node-tests }}
      dom-tests: ${{ steps.plan.outputs.dom-tests }}
      build: ${{ steps.plan.outputs.build }}
      cell-e2e: ${{ steps.plan.outputs.cell-e2e }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Calculate affected verification lanes
        id: plan
        env:
          VERIFY_SCRIPT: ${{ env.VERIFY_SCRIPT }}
          VERIFY_BASE: ${{ env.VERIFY_BASE }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { parseArguments, collectChangedFiles, createVerificationPlan } from './scripts/quality/verification.mjs';

          const mode = process.env.VERIFY_SCRIPT.replace('check:', '');
          const changes = collectChangedFiles(process.env.VERIFY_BASE || undefined);
          const phases = {
            quality: 'quality',
            'workspace-tests': 'workspace-tests',
            'root-node': 'node-tests',
            'root-dom': 'dom-tests',
            build: 'build',
            'cell-e2e': 'cell-e2e',
          };
          const output = process.env.GITHUB_OUTPUT;
          for (const [phase, outputName] of Object.entries(phases)) {
            const options = parseArguments(['--mode', mode, '--phase', phase]);
            const plan = createVerificationPlan(options, changes);
            appendFileSync(output, `${outputName}=${plan.tasks.length > 0}\n`);
          }
          NODE

  quality:
    name: Quality
    needs: [release-metadata, plan]
    if: needs.plan.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - &setup-node
        name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - &install
        name: Install dependencies
        run: npm ci

      - name: Verify Cell UI Registry source
        run: |
          npm run cell-ui:registry:verify
          npm run cell-ui:registry:typecheck

      - name: Run quality checks
        run: |
          if [ -n "$VERIFY_BASE" ]; then
            npm run "$VERIFY_SCRIPT" -- --phase quality --base "$VERIFY_BASE"
          else
            npm run "$VERIFY_SCRIPT" -- --phase quality
          fi

  workspace-tests:
    name: Workspace tests (${{ matrix.group }})
    needs: [release-metadata, plan]
    if: needs.plan.outputs.workspace-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [core, products, services, sites]
    env:
      VERIFY_WORKSPACE_GROUP: ${{ matrix.group }}
    steps:
      - *checkout
      - *setup-node
      - name: Plan workspace group
        id: workspace-plan
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { parseArguments, collectChangedFiles, createVerificationPlan } from './scripts/quality/verification.mjs';
          const options = parseArguments([
            '--mode', process.env.VERIFY_SCRIPT.replace('check:', ''),
            '--phase', 'workspace-tests',
            '--workspace-group', process.env.VERIFY_WORKSPACE_GROUP,
          ]);
          const plan = createVerificationPlan(options, collectChangedFiles(process.env.VERIFY_BASE || undefined));
          appendFileSync(process.env.GITHUB_OUTPUT, `required=${plan.tasks.length > 0}\n`);
          NODE
      - name: Install dependencies
        if: steps.workspace-plan.outputs.required == 'true'
        run: npm ci
      - name: Run workspace tests
        if: steps.workspace-plan.outputs.required == 'true'
        env:
          VERIFY_TASK_TIMEOUT_MS: 300000
        run: |
          if [ -n "$VERIFY_BASE" ]; then
            npm run "$VERIFY_SCRIPT" -- --phase workspace-tests --workspace-group "$VERIFY_WORKSPACE_GROUP" --base "$VERIFY_BASE"
          else
            npm run "$VERIFY_SCRIPT" -- --phase workspace-tests --workspace-group "$VERIFY_WORKSPACE_GROUP"
          fi

  node-tests:
    name: Node tests
    needs: [release-metadata, plan]
    if: needs.plan.outputs.node-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup-node
      - *install
      - name: Run Node tests
        run: |
          node --test scripts/github-stars/publish.test.mjs
          if [ -n "$VERIFY_BASE" ]; then
            npm run "$VERIFY_SCRIPT" -- --phase root-node --base "$VERIFY_BASE"
          else
            npm run "$VERIFY_SCRIPT" -- --phase root-node
          fi

  dom-tests:
    name: DOM tests (${{ matrix.shard }})
    needs: [release-metadata, plan]
    if: needs.plan.outputs.dom-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - *checkout
      - *setup-node
      - *install
      - name: Run DOM tests
        run: |
          if [ -n "$VERIFY_BASE" ]; then
            npm run "$VERIFY_SCRIPT" -- --phase root-dom --shard "${{ matrix.shard }}" --base "$VERIFY_BASE"
          else
            npm run "$VERIFY_SCRIPT" -- --phase root-dom --shard "${{ matrix.shard }}"
          fi

  build:
    name: Build
    needs: [release-metadata, plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout
      - *setup-node
      - *install
      - name: Build affected products
        env:
          VITE_ACCOUNT_API_ENDPOINT: https://sync.chardesk.com
          VITE_BUILD_ID: ${{ github.sha }}
        run: |
          if [ -n "$VERIFY_BASE" ]; then
            npm run "$VERIFY_SCRIPT" -- --phase build --base "$VERIFY_BASE"
          else
            npm run "$VERIFY_SCRIPT" -- --phase build
          fi
      - name: Preserve the Canvas build for deployment
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: canvas-dist
          path: apps/canvas/dist
          if-no-files-found: error
          retention-days: 1

  cell-e2e:
    name: Cell UI browser tests (${{ matrix.project }})
    needs: [release-metadata, plan]
    if: needs.plan.outputs.cell-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    env:
      CELL_E2E_PROJECT: ${{ matrix.project }}
    steps:
      - *checkout
      - *setup-node
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser runtimes
        run: npx playwright install --with-deps "$CELL_E2E_PROJECT"
      - name: Verify affected Cell UI browser flows
        run: |
          if [ -n "$VERIFY_BASE" ]; then
            npm run "$VERIFY_SCRIPT" -- --phase cell-e2e --cell-project "$CELL_E2E_PROJECT" --base "$VERIFY_BASE"
          else
            npm run "$VERIFY_SCRIPT" -- --phase cell-e2e --cell-project "$CELL_E2E_PROJECT"
          fi

  verify:
    name: Verify
    if: ${{ always() }}
    needs: [release-metadata, plan, quality, workspace-tests, node-tests, dom-tests, build, cell-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification lane
        run: |
          test "${{ needs.release-metadata.result }}" = "success"
          test "${{ needs.plan.result }}" = "success"
          check_lane() {
            result="$1"
            required="$2"
            if [ "$required" = "true" ]; then
              test "$result" = "success"
            else
              test "$result" = "skipped"
            fi
          }
          check_lane "${{ needs.quality.result }}" "${{ needs.plan.outputs.quality }}"
          check_lane "${{ needs.workspace-tests.result }}" "${{ needs.plan.outputs.workspace-tests }}"
          check_lane "${{ needs.node-tests.result }}" "${{ needs.plan.outputs.node-tests }}"
          check_lane "${{ needs.dom-tests.result }}" "${{ needs.plan.outputs.dom-tests }}"
          check_lane "${{ needs.build.result }}" "${{ needs.plan.outputs.build }}"
          check_lane "${{ needs.cell-e2e.result }}" "${{ needs.plan.outputs.cell-e2e }}"

  deploy-canvas:
    name: Deploy Canvas
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Require Cloudflare Pages credentials
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_PAGES_API_TOKEN and CLOUDFLARE_ACCOUNT_ID for Canvas deployment"
            exit 1
          fi
      - *checkout
      - *setup-node
      - name: Restore the verified Canvas build
        uses: actions/download-artifact@v4
        with:
          name: canvas-dist
          path: apps/canvas/dist
      - name: Deploy Canvas to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/canvas
          command: pages deploy dist --project-name=chardesk-canvas --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Require a production deployment
        env:
          PAGES_ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
        run: |
          if [ "$PAGES_ENVIRONMENT" != production ]; then
            echo "::error::chardesk-canvas must use main as its production branch"
            exit 1
          fi
