<div id="cell-ui-semantic-preview">
  <style>
    #cell-ui-semantic-preview {
      color-scheme: light dark;
      --cell-preview-bg: light-dark(#ffffff, #000000);
      --cell-preview-ink: light-dark(#000000, #ffffff);
      --cell-preview-danger: light-dark(#8c2522, #ffc6c4);
      --cell-preview-danger-fill: light-dark(#8c2522, #4b1b1b);
      --cell-preview-danger-on-fill: light-dark(#ffffff, #ffc6c4);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      max-width: 736px;
      color: var(--cell-preview-ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #cell-ui-semantic-preview .example {
      min-width: 0;
    }
    #cell-ui-semantic-preview .caption {
      margin-bottom: 8px;
      font-weight: 500;
    }
    #cell-ui-semantic-preview .cell-screen {
      box-sizing: border-box;
      overflow: hidden;
      padding: 16px;
      border: 1px solid var(--cell-preview-ink);
      background: var(--cell-preview-bg);
    }
    #cell-ui-semantic-preview pre {
      margin: 0;
      overflow: hidden;
      color: inherit;
      font: inherit;
      white-space: pre;
    }
    #cell-ui-semantic-preview .danger {
      color: var(--cell-preview-danger);
    }
    #cell-ui-semantic-preview .danger-action {
      color: var(--cell-preview-danger-on-fill);
      background: var(--cell-preview-danger-fill);
    }
    @media (max-width: 620px) {
      #cell-ui-semantic-preview { grid-template-columns: 1fr; }
    }
  </style>
  <div class="example">
    <div class="caption">输入验证失败 · proposed</div>
    <div class="cell-screen" role="img" aria-label="Email 输入框包含 henry@，带有感叹号及明确错误文字：Enter a valid email address.">
      <pre>Email
<span class="danger">┌──────────────────────────┐</span>
<span class="danger">│</span> henry@                   <span class="danger">│</span>
<span class="danger">└──────────────────────────┘</span>
<span class="danger">!</span> Enter a valid email address.</pre>
    </div>
  </div>
  <div class="example">
    <div class="caption">危险操作 · proposed</div>
    <div class="cell-screen" role="img" aria-label="删除项目确认：This cannot be undone. 操作分别为 Cancel 和 Delete project，后者使用危险色。">
      <pre>Delete project?
This cannot be undone.

[ Cancel ]  <span class="danger-action">[ Delete project ]</span></pre>
    </div>
  </div>
</div>
