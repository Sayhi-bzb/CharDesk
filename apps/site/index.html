<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      document.documentElement.classList.add("site-js");
      try {
        if (localStorage.getItem("chardesk-site-theme") === "dark") {
          document.documentElement.dataset.siteTheme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#000000";
        }
      } catch { /* Use the light theme when storage is unavailable. */ }
      window.setTimeout(() => {
        if (document.querySelector(".site-loading")) document.documentElement.classList.add("site-slow");
      }, 5000);
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/site.css" />
    <link rel="canonical" href="https://chardesk.com/" />
    <title>CharDesk — A visual medium for people and agents</title>
    <meta name="description" content="A shared visual medium for people and agents. Create visual work with Canvas or interactive interfaces with Cell UI." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chardesk.com/" />
    <meta property="og:title" content="CharDesk — A visual medium for people and agents" />
    <meta property="og:description" content="A shared visual medium for people and agents. Create visual work with Canvas or interactive interfaces with Cell UI." />
    <meta property="og:image" content="https://chardesk.com/showcase/01-shared-medium.png" />
    <script defer src="/site.js"></script>
  </head>
  <body>
    <main id="root" class="site-shell">
      <div class="site-loading site-startup-window" role="status" aria-live="polite">
        <div class="site-startup-title">Welcome to CharDesk</div>
        <div class="site-startup-body">
          <img src="/icon.svg" width="24" height="24" alt="" />
          <p>Starting CharDesk…</p>
          <nav class="site-loading-links site-startup-links" aria-label="Quick links while loading">
            <a href="https://canvas.chardesk.com/">Canvas</a>
            <a href="https://ui.chardesk.com/">Cell UI</a>
            <a href="/docs/">Documentation</a>
            <a href="https://github.com/Sayhi-bzb/CharDesk">GitHub</a>
          </nav>
        </div>
      </div>
      <div class="site-fallback site-startup-window">
        <div class="site-startup-title">Welcome to CharDesk</div>
        <div class="site-startup-body">
          <img src="/icon.svg" width="24" height="24" alt="" />
          <h1>Visual text for people and agents.</h1>
          <nav class="site-startup-links" aria-label="Products">
            <a href="https://canvas.chardesk.com/">Canvas — visual work agents can revise</a>
            <a href="https://ui.chardesk.com/">Cell UI — interfaces agents can inspect</a>
            <a href="/docs/">Documentation</a>
            <a href="https://github.com/Sayhi-bzb/CharDesk">GitHub</a>
          </nav>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
