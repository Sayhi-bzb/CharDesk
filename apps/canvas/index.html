<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="/startup.css" />
    <script>
      try {
        const theme = localStorage.getItem('chardesk-host-theme');
        if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch { /* Use the light startup palette. */ }
    </script>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#803c51" />

    <title>CharDesk — Unicode Canvas for Humans and AI</title>
    <meta name="description" content="Draw diagrams, interfaces, slides, and Unicode art on an editable text canvas built for humans to see and AI to understand." />
    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://canvas.chardesk.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://canvas.chardesk.com/" />
    <meta property="og:title" content="CharDesk — Unicode Canvas for Humans and AI" />
    <meta property="og:description" content="Draw diagrams, interfaces, slides, and Unicode art on an editable text canvas built for humans to see and AI to understand." />
    <meta property="og:image" content="https://chardesk.com/showcase/01-shared-medium.png" />
    <meta property="og:image:alt" content="CharDesk shared Unicode canvas for humans and AI" />
    <meta property="og:site_name" content="CharDesk" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://canvas.chardesk.com/" />
    <meta name="twitter:title" content="CharDesk — Unicode Canvas for Humans and AI" />
    <meta name="twitter:description" content="Draw diagrams, interfaces, slides, and Unicode art on an editable text canvas built for humans to see and AI to understand." />
    <meta name="twitter:image" content="https://chardesk.com/showcase/01-shared-medium.png" />
    <meta name="twitter:image:alt" content="CharDesk shared Unicode canvas for humans and AI" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CharDesk",
        "url": "https://canvas.chardesk.com/",
        "description": "Draw diagrams, interfaces, slides, and Unicode art on an editable text canvas built for humans to see and AI to understand.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "isAccessibleForFree": true,
        "image": "https://chardesk.com/showcase/01-shared-medium.png"
      }
    </script>
  </head>
  <body>
    <div id="root">
      <main class="startup-shell" data-startup-phase="opening" aria-busy="true">
        <div class="startup-content">
          <div class="startup-brand">CharDesk</div>
          <h1 class="startup-title" role="status" aria-live="polite">Opening Canvas</h1>
          <div class="startup-progress" aria-hidden="true"></div>
          <noscript><p class="startup-detail">Enable JavaScript to use Canvas.</p></noscript>
        </div>
      </main>
    </div>
    <script>
      try {
        const saved = localStorage.getItem('chardesk-ui-language')
          || localStorage.getItem('ascii-canvas-ui-language');
        const preferred = saved || navigator.languages?.[0] || navigator.language;
        if (/^zh(?:-|$)/i.test(preferred || '')) {
          document.documentElement.lang = 'zh-CN';
          document.querySelector('.startup-title').textContent = '正在打开 Canvas';
        }
      } catch { /* Keep the English first-frame copy. */ }
    </script>

    <script type="module" src="./src/app/main.tsx"></script>

  </body>
</html>
